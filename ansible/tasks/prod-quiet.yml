---
# CI sets prod_quiet_check on pushes to main, see "Everyday use" in ansible/README.md
- name: Leave prod alone while a campaign uses it
  when: prod_quiet_check | default(false) | bool
  block:
    # fails on a fresh box or without a database, which counts as quiet
    - name: Count glasses added or dispensed in the last 48 hours
      ansible.builtin.command:
        cmd: docker compose exec -T mariadb sh -c 'exec mariadb -uroot -p"$MARIADB_ROOT_PASSWORD" -N "$MARIADB_DATABASE"'
        chdir: /srv/prod
        stdin: |
          select (select count(*) from glasses where creation_date > now() - interval 48 hour)
               + (select count(*) from dispense where modify_date > now() - interval 48 hour);
      register: prod_recent_activity
      changed_when: false
      failed_when: false

    # fail rather than skip: GitHub has no neutral job result and a cancelled run is easy to miss
    - name: Stop if prod is in use
      ansible.builtin.fail:
        msg: >-
          {{ prod_recent_activity.stdout }} glasses added or dispensed in the last 48 hours, prod left alone.
          Re-run once it's quiet.
      when: prod_recent_activity.stdout | default('') | int > 0
