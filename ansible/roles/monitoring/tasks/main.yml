- name: Create install directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
    owner: "root"
    group: "root"
  with_items:
    - "{{ monitoring_install_location }}"
    - "{{ monitoring_install_location }}/grafana"
    - "{{ monitoring_install_location }}/prometheus"
  become: true

- name: Create data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0777"
    owner: "root"
    group: "root"
  with_items:
    - "{{ monitoring_install_location }}/grafana/data"
    - "{{ monitoring_install_location }}/prometheus/data"
    - "{{ monitoring_install_location }}/grafana/provisioning/datasources"
    - "{{ monitoring_install_location }}/grafana/provisioning/dashboards"
    - "{{ monitoring_install_location }}/grafana/provisioning/dashboards/json"
  become: true

- name: Allow containers to reach node_exporter on the host
  community.general.ufw:
    rule: allow
    from_ip: 172.16.0.0/12
    port: "9100"
    proto: tcp
  become: true

- name: Create docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_install_location }}/docker-compose.yml"
    mode: "0600"
    owner: "root"
    group: "root"
  become: true

- name: Copy prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_install_location }}/prometheus/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart prometheus

- name: Copy grafana datasources config
  ansible.builtin.template:
    src: grafana-datasources.yml.j2
    dest: "{{ monitoring_install_location }}/grafana/provisioning/datasources/custom.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart grafana

- name: Copy grafana dashboard provider config
  ansible.builtin.template:
    src: grafana-dashboards.yml.j2
    dest: "{{ monitoring_install_location }}/grafana/provisioning/dashboards/reims2.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart grafana

# grafana polls this directory, dashboard changes need no restart
- name: Copy grafana dashboards
  ansible.builtin.copy:
    src: dashboards/
    dest: "{{ monitoring_install_location }}/grafana/provisioning/dashboards/json/"
    owner: root
    group: root
    mode: "0644"

- name: Start monitoring
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_install_location }}"
    project_name: monitoring
    pull: missing
    wait: true
    remove_orphans: true
  become: true
