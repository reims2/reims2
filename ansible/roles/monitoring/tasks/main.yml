- name: Create install directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
    owner: "root"
    group: "root"
  with_items:
    - "{{ grafana_install_location }}"
    - "{{ prometheus_install_location }}"
  become: true

- name: Create data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0777"
    owner: "root"
    group: "root"
  with_items:
    - "{{ grafana_data_location }}"
    - "{{ prometheus_data_location }}"
    - "{{ grafana_provisioning_location }}/datasources"
    - "{{ grafana_provisioning_location }}/dashboards"
    - "{{ grafana_provisioning_location }}/dashboards/json"
  become: true

- name: Create networks
  community.docker.docker_network:
    name: "{{ item }}"
    driver: "overlay"
    driver_options:
      com.docker.network.bridge.name: "{{ item }}"
  become: true
  loop:
    - "{{ monitoring_network }}"

- name: Allow prometheus to scrape node_exporter on the host
  community.general.ufw:
    rule: allow
    direction: in
    interface: docker_gwbridge
    port: "{{ node_exporter_port }}"
    proto: tcp
  become: true

- name: Create docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ grafana_install_location }}/docker-compose.yml"
    mode: "0660"
    owner: "root"
    group: "docker"
    validate: docker-compose -f %s config -q
  become: true
  notify:
    - reload monitoring
    - wait for grafana

- name: Copy prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_location }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload monitoring
    - wait for prometheus

- name: Copy grafana datasources config
  ansible.builtin.template:
    src: grafana-datasources.yml.j2
    dest: "{{ grafana_provisioning_location }}/datasources/custom.yaml"
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload monitoring
    - wait for grafana

- name: Copy grafana dashboard provider config
  ansible.builtin.template:
    src: grafana-dashboards.yml.j2
    dest: "{{ grafana_provisioning_location }}/dashboards/reims2.yaml"
    owner: root
    group: root
    mode: "0644"
  notify:
    - restart grafana
    - wait for grafana

# grafana polls this directory, dashboard changes need no restart
- name: Copy grafana dashboards
  ansible.builtin.copy:
    src: dashboards/
    dest: "{{ grafana_provisioning_location }}/dashboards/json/"
    owner: root
    group: root
    mode: "0644"
