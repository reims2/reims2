---
monitoring_domain: monitoring.{{ app_domain }}
monitoring_network: monitoring

grafana_install_location: "/srv/grafana"
grafana_data_location: "{{ grafana_install_location }}/data"
grafana_provisioning_location: "{{ grafana_install_location }}/provisioning"

prometheus_install_location: "/srv/prometheus"
prometheus_data_location: "{{ prometheus_install_location }}/data"
prometheus_config_location: "{{ prometheus_install_location }}/prometheus.yml"
db_exporter_config_location: "{{ prometheus_install_location }}/db_exporter.cnf"

grafana_port: "3000"
prometheus_port: "9090"

# node_exporter runs on the host network, reachable from swarm containers via the docker_gwbridge gateway
node_exporter_host: "{{ ansible_facts['docker_gwbridge']['ipv4']['address'] | default('172.18.0.1') }}"
node_exporter_port: "9100"
