---
- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
    owner: root
    group: root
  loop:
    - "{{ traefik_install_location }}"
    - "{{ traefik_acme_location }}"
    - "{{ traefik_config_location }}"

- name: Create the proxy network
  community.docker.docker_network:
    name: "{{ proxy_network }}"

- name: Write the compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ traefik_install_location }}/docker-compose.yml"
    mode: "0644"

# traefik watches this directory, changes need no restart
- name: Write the dynamic config
  ansible.builtin.template:
    src: dynamic_conf.yml.j2
    dest: "{{ traefik_config_location }}/dynamic_conf.yml"
    mode: "0600"

- name: Start traefik
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_install_location }}"
    project_name: traefik
    pull: missing
    wait: true
    remove_orphans: true
