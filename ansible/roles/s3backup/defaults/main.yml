---
s3backup_install_location: "/srv/{{ stack }}/s3backup"

s3backup_bucket_name: reims2-backup

# Grafana keeps its users and UI edits in grafana.db in here
s3backup_grafana_data_location: /srv/monitoring/grafana/data

# renovate: datasource=docker depName=docker.io/amazon/aws-cli
s3backup_awscli_version: 2.38.1

# shoutrrr URL of the healthchecks.io check, generic://hc-ping.com/<uuid>, empty disables it
s3backup_healthcheck_url: ""

# false deploys the backup but keeps it stopped, for test boxes that must never upload
s3backup_enabled: true
