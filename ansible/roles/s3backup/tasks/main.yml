- name: Create the install dir
  ansible.builtin.file:
    path: "{{ s3backup_install_location }}"
    state: directory
    mode: "0700"
    owner: "root"
    group: "root"
  become: true

- name: Deploy the restore script
  ansible.builtin.template:
    src: restore.sh
    dest: "{{ s3backup_install_location }}/restore.sh"
    mode: "0700"
    owner: "root"
    group: "root"
  become: true

- name: Create docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ s3backup_install_location }}/docker-compose.yml"
    mode: "0600"
    owner: "root"
    group: "root"
  become: true

- name: Start the backup
  community.docker.docker_compose_v2:
    project_src: "{{ s3backup_install_location }}"
    project_name: s3backup
    state: "{{ 'present' if s3backup_enabled else 'absent' }}"
    pull: missing
    wait: true
    remove_orphans: true
  become: true
