- name: Set authorized SSH pubkeys from file
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    state: present
    key: "{{ lookup('file', 'creds/pub_keys') }}"
  # creds/ is not in git, so CI runs leave the keys as they are
  when: (playbook_dir ~ '/creds/pub_keys') is file

- name: Install Docker
  ansible.builtin.include_role:
    name: geerlingguy.docker
  vars:
    docker_daemon_options:
      live-restore: true
      log-driver: json-file
      log-opts:
        max-size: 10m
        max-file: "3"

- name: Install Python packages for the Docker modules
  ansible.builtin.package:
    name:
      - python3-docker
      - python3-requests
    state: present

- name: Enable auto upgrade
  ansible.builtin.include_role:
    name: hifis.toolkit.unattended_upgrades
  vars:
    unattended_automatic_reboot: true
    unattended_automatic_reboot_time: "08:00"
    unattended_update_days: '{"Mon"}'
    unattended_download_upgradeable: 7

- name: Enable swap
  ansible.builtin.include_role:
    name: geerlingguy.swap
  vars:
    swap_file_size_mb: "4096"

# on 2026-09-17 networkd gave up renewing under memory pressure and the lease ran out
- name: Keep the DHCP address if networkd stops renewing it
  ansible.builtin.copy:
    dest: /etc/netplan/90-keep-dhcp.yaml
    mode: "0600"
    content: |
      network:
        version: 2
        ethernets:
          {{ ansible_facts['default_ipv4']['interface'] }}:
            critical: true
  notify: Apply netplan

- name: Clean up docker weekly
  ansible.builtin.cron:
    name: docker cleanup
    minute: "0"
    hour: "4"
    weekday: "0"
    user: root
    job: "docker system prune -a -f --filter 'until=336h'"
    cron_file: docker-cleanup

# 114MB initrds with MODULES=most overflowed the 488MB /boot, which blocked removing old kernels
- name: Only put modules this VM needs into the initramfs
  ansible.builtin.lineinfile:
    path: /etc/initramfs-tools/initramfs.conf
    regexp: "^MODULES="
    line: MODULES=dep
  notify: Rebuild initramfs

- name: Apt upgrade
  ansible.builtin.apt:
    upgrade: true
    update_cache: true
    cache_valid_time: 86400 # One day
    autoremove: true

- name: Install some packages (user-specified)
  ansible.builtin.package:
    name:
      - htop
      - nano
      - kitty
      - glances
    state: present

- name: Allow ssh ufw
  community.general.ufw:
    rule: allow
    name: OpenSSH
- name: Allow http ufw
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
- name: Allow https ufw
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny
