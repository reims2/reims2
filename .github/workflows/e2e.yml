name: E2E test

on:
  workflow_call:
    inputs:
      pushed-images:
        description: "Test the sha-<commit> images docker.yml pushed instead of building from source"
        type: boolean
        default: false
  schedule:
    - cron: "7 15 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # schedule and manual runs get the full suite on all browsers, everything else @fast on chromium
      FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use pushed images
        if: inputs.pushed-images
        run: |
          echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          e2e/stack.sh pull --quiet
      - name: Setup Docker buildx
        if: ${{ !inputs.pushed-images }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build images
        if: ${{ !inputs.pushed-images }}
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: compose.yaml
          load: true
          # same cache scopes as docker.yml, so PRs reuse main's layers
          set: |
            backend.cache-from=type=gha,scope=backend
            frontend.cache-from=type=gha,scope=frontend
            docs.cache-from=type=gha,scope=docs

      - name: Start stack
        run: e2e/stack.sh up

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: "e2e/.nvmrc"
          cache: "yarn"
          cache-dependency-path: "e2e/yarn.lock"
      - name: Install dependencies
        working-directory: ./e2e
        run: yarn install --immutable
      - name: Lint
        working-directory: ./e2e
        run: |
          yarn eslint --max-warnings 0 tests playwright.config.ts
          yarn format:check
          yarn typecheck
      - name: Install Playwright browsers
        working-directory: ./e2e
        run: |
          if [ "$FULL" = true ]; then
            yarn playwright install --with-deps
          else
            yarn playwright install --with-deps chromium
          fi
      - name: Run tests
        working-directory: ./e2e
        run: |
          if [ "$FULL" = true ]; then
            yarn playwright test
          else
            yarn playwright test --project chromium --grep @fast
          fi

      - name: Stack logs
        if: failure()
        run: e2e/stack.sh logs --no-color --tail 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
