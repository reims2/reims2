name: Server setup

on:
  push:
    branches:
      - "main"
    paths:
      - "ansible/setup.yml"
      - "ansible/requirements.yml"
      - "ansible/roles/setup/**"
      - "ansible/roles/hardening/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    uses: ./.github/workflows/ansible.yml
    secrets: inherit
    with:
      playbook: setup.yml
      stack: prod
