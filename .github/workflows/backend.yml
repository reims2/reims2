on:
  workflow_call:

defaults:
  run:
    working-directory: ./backend

jobs:
  ci:
    name: "Lint, test, build"
    runs-on: ubuntu-latest
    if: ${{ github.event.action != 'labeled' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7\
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            src:
              - ".github/**"
              - "backend/**"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        if: steps.filter.outputs.src == 'true'
        with:
          cache: maven
          distribution: temurin
          java-version: 21

      - name: Build with Maven
        if: steps.filter.outputs.src == 'true'
        run: mvn -B package --file pom.xml

      # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
      - name: Update dependency graph
        if: steps.filter.outputs.src == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6
        with:
          directory: backend
