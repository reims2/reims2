name: Deploy

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  frontend-ci:
    name: "Frontend"
    uses: ./.github/workflows/frontend.yml
  backend-ci:
    name: "Backend"
    uses: ./.github/workflows/backend.yml
  docs-ci:
    name: "Docs"
    uses: ./.github/workflows/docs.yml
  ansible-lint:
    name: "Ansible"
    uses: ./.github/workflows/ansible-lint.yml

  docker:
    strategy:
      matrix:
        component: [frontend, backend, docs]
    name: "Docker build"
    uses: ./.github/workflows/docker.yml
    concurrency: docker-${{ matrix.component }}-${{ github.ref }}
    secrets: inherit # pass all secrets
    with:
      component: ${{ matrix.component }}

  e2e:
    name: "Run E2E Tests"
    if: github.ref == 'refs/heads/main'
    needs:
      - docker
    uses: ./.github/workflows/e2e.yml
    with:
      pushed-images: true

  deploy-staging:
    name: "Deploy staging"
    # set the DEPLOY_FREEZE repo variable to true during campaigns
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_FREEZE != 'true'
    needs:
      - e2e
    uses: ./.github/workflows/ansible.yml
    secrets: inherit
    with:
      stack: staging

  deploy-prod:
    name: "Deploy production"
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_FREEZE != 'true'
    needs:
      - frontend-ci
      - backend-ci
      - docs-ci
      - ansible-lint
      - e2e
      - deploy-staging
    uses: ./.github/workflows/ansible.yml
    secrets: inherit
    with:
      stack: prod
