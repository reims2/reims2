name: PR

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  frontend-ci:
    name: "Frontend"
    uses: ./.github/workflows/frontend.yml
  backend-ci:
    name: "Backend"
    uses: ./.github/workflows/backend.yml
  docs-ci:
    name: "Docs"
    uses: ./.github/workflows/docs.yml
  e2e:
    name: "E2E"
    uses: ./.github/workflows/e2e.yml

