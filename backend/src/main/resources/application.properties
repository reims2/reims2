spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

server.port=${PORT:9966}
spring.threads.virtual.enabled=true

logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# a login ends after this long without use
spring.session.timeout=90d
# as long as browsers keep a cookie, so only the session timeout ends a login
server.servlet.session.cookie.max-age=400d
server.servlet.session.cookie.same-site=strict
# Flyway owns the session tables
spring.session.jdbc.initialize-schema=never
springdoc.swagger-ui.csrf.enabled=true

# heapdump, env and the like would hand secrets to anything on the docker networks
management.endpoints.web.exposure.include=health,info,metrics,prometheus
